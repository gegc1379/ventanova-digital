<div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-shadow flex flex-col h-full">
  <div class="h-48 bg-slate-50 relative p-4 flex items-center justify-center">
    <img 
      [src]="producto.imagenUrl" 
      [alt]="producto.nombre" 
      class="max-w-full max-h-full object-contain mix-blend-multiply"
    >
    @if (producto.destacado) {
      <span class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider shadow-sm">
        Destacado
      </span>
    }
  </div>

  <div class="p-5 flex flex-col grow">
    <span class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">{{ producto.categoria }}</span>
    <h3 class="text-lg font-bold text-slate-800 mb-2 line-clamp-1">{{ producto.nombre }}</h3>
    <p class="text-sm text-slate-500 mb-4 line-clamp-2 grow">{{ producto.descripcion }}</p>
    
    <div class="flex items-center justify-between pt-3 border-t border-slate-50">
      <span class="text-xl font-extrabold text-slate-900">{{ producto.precio | currency:'CLP':'$':'1.0-0' }}</span>
      
      <button 
        (click)="notificarSeleccion()" 
        class="bg-slate-900 hover:bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors outline-none"
      >
        {{ textoBoton }}
      </button>
    </div>
  </div>
</div>
